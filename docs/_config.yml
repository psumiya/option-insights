title: Option Insights
description: Documentation for Option Insights, a private, in-browser options trading journal and analytics dashboard.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

url: https://psumiya.github.io
baseurl: /option-insights

color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Open the app": "https://sumiya.page/insights/index.html"
  "GitHub": "https://github.com/psumiya/option-insights"
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/psumiya/option-insights"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

footer_content: "Option Insights is a personal tool and may contain errors. No warranty or guarantee is provided."

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Heads up
    color: yellow

exclude:
  - AI_RESEARCH.md
  - BROKER_SUPPORT.md
  - TESTING.md
